apiVersion: yht.io/v1
kind: CustomerDeploymentProfile
installProfile: commercial
metadata:
  customerCode: sample-org
  profileRevision: 1
  environment: staging
deployment:
  target:
    osFamily: linux
    architecture: x86_64
    initSystem: systemd
    reverseProxy: nginx
  identity:
    targetId: sample-org-staging
    provider: aliyun-ecs
    region: cn-hangzhou
    instanceId: i-synthetic00000001
    workbenchProfile: sample-org-staging
  paths:
    installRoot: /opt/yihetong
    dataRoot: /var/lib/yihetong
    configRoot: /etc/yihetong
    backupRoot: /var/backups/yihetong
  ports:
    api: 8763
    website: 3001
  endpoints:
    apiBaseUrl: https://api.example.invalid
    manageBaseUrl: https://manage.example.invalid
    userBaseUrl: https://user.example.invalid
    h5BaseUrl: https://h5.example.invalid
    websiteBaseUrl: https://www.example.invalid
database:
  engine: mysql
  majorVersion: 8
  host: 127.0.0.1
  port: 3306
  name: esign
  username: esign
  passwordRef: secret://database.password
  migration:
    username: esign_migration
    passwordRef: secret://database.migration-password
  backup:
    username: esign_backup
    passwordRef: secret://database.backup-password
  tlsMode: disabled-loopback-only
redis:
  user:
    host: 127.0.0.1
    port: 6379
    database: 0
    passwordRef: secret://redis.user.password
  default:
    host: 127.0.0.1
    port: 6379
    database: 1
    passwordRef: secret://redis.default.password
storage:
  provider: aliyun-oss
  region: oss-cn-example
  privateBucket: sample-private-bucket
  assetsBucket: sample-assets-bucket
  internalEndpoint: oss-cn-example-internal.aliyuncs.com
  externalEndpoint: oss-cn-example.aliyuncs.com
  privateDomain: https://sample-private.example.invalid
  assetsDomain: https://sample-assets.example.invalid
  privateUrlExpireSeconds: 900
  uploadPolicyExpireSeconds: 300
  credentialMode: ram-role
  ramRoleName: sample-runtime-role
tls:
  mode: external-termination
  externalActionId: tls-edge-termination
security:
  sensitiveDbCompatibilityMode: false
commercialAuthorization:
  enforcement: required
  product: yihetong
  edition: use
  instanceId: 00000000-0000-4000-8000-000000000001
  controlPlaneUrl: https://license.example.invalid
  licenseFile: commercial/license.json
  leaseFile: commercial/lease.json
  trustBundleFile: commercial/trust-bundle.json
  identityFile: commercial/instance.json
  privateKeyFile: commercial/instance-private.pem
  stateFile: commercial/clock-state.json
  leaseRequired: true
  leaseRefreshSeconds: 900
  offlineGraceSeconds: 86400
  clockSkewSeconds: 300
brand:
  projectName: 一合通
  companyName: 示例运营主体
  subtitle: 企业电子合同全流程服务平台
  logo: asset://assets/logo.svg
  logoWhite: asset://assets/logo-white.svg
  logoSquare: asset://assets/logo.svg
  logoIcon: asset://assets/logo.svg
  loginBackground: asset://assets/login-background.svg
  homeLogoWhiteBg: asset://assets/logo.svg
  homeBannerImages:
    - asset://assets/login-background.svg
  shareImage: asset://assets/logo.svg
  agentApplyBackground: asset://assets/login-background.svg
  inviteBackground: asset://assets/login-background.svg
  shareTitle: 一合通 - 企业电子合同全流程服务平台
  shareDesc: 覆盖合同模板、审批、电子签署、合同智能处理、多端协同和私有化部署。
  copyrightText: Copyright (c) 示例运营主体
  privacySubject: 示例运营主体
  serviceAgreementSubject: 示例运营主体
  personalRegisterGiftContractCount: 0
  enterpriseRegisterGiftContractCount: 0
  websiteEnabled: true
  websiteDomain: www.example.invalid
  websiteSeoTitle: 一合通企业电子合同
  websiteSeoDescription: 企业电子合同与私有部署服务
  websiteSeoKeywords: 电子合同,合同审批,电子签署,私有化部署
  websiteCtaText: 预约演示
  websiteCtaLink: '#cta'
  websiteUserUrl: https://user.example.invalid
  websiteManageUrl: https://manage.example.invalid
  websiteH5Url: https://h5.example.invalid
  websiteContactEmail: ops@example.invalid
  websiteContent:
    features:
      - title: 合同全流程
        description: 示例内容，仅用于模板结构校验。
  moduleSwitches:
    inviteEnabled: true
    serviceAssistantEnabled: true
    startContractEnabled: true
    aiContractEnabled: true
    contractAuditEnabled: true
    contractCompareEnabled: true
    rechargeEnabled: false
    videoRecordingEnabled: true
miniProgram:
  enabled: true
  appId: wxEXAMPLE000000000
  appSecretRef: secret://mini-program.app-secret
  platformActionIds:
    - wechat-domain-registration
    - wechat-code-review
capabilities:
  openapi:
    enabled: false
    notApplicable:
      reason: Not enabled for the phase-one synthetic acceptance profile.
      approvedBy: delivery-owner
  payment:
    enabled: false
    notApplicable:
      reason: Real payment remains user-final-required.
      approvedBy: delivery-owner
  sms:
    enabled: false
    notApplicable:
      reason: Real SMS remains user-final-required.
      approvedBy: delivery-owner
  ai:
    enabled: false
    notApplicable:
      reason: External model credentials are not required for base installation acceptance.
      approvedBy: delivery-owner
  ocr:
    enabled: false
    notApplicable:
      reason: OCR is feature-conditional and excluded from the base acceptance profile.
      approvedBy: delivery-owner
externalActions:
  - id: tls-edge-termination
    platform: external-tls
    action: 在开放公网流量前配置并批准 HTTPS 终止。
    owner: delivery-owner
    state: user-final-required
    verification: 在获准环境核验证书链和 HTTPS 健康状态。
  - id: wechat-domain-registration
    platform: wechat
    action: 登记 request、upload、download 和 business 合法域名。
    owner: delivery-owner
    state: user-final-required
    verification: 对照生成清单核验平台域名列表。
  - id: wechat-code-review
    platform: wechat
    action: 上传使用显式 AppID 的构建包并提交平台审核。
    owner: delivery-owner
    state: user-final-required
    verification: 分别记录平台回执和真机验收结果。
