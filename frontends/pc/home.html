<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>...</title>
    <style>
      *{
        padding: 0;
        margin: 0;
      }
      html,body{
        width: 100%;
        height: 100%;
      }
      .app{
        display: flex;
        align-items: center;
        justify-content: center;
        color: green;
        font-size: 20px;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="appBox" class="app"></div>
  </body>
  <script type="text/javascript" src="https://res.wx.qq.com/open/js/jweixin-1.3.2.js"></script>
  <script type="text/javascript">
    // https://h5.example.com/home.html
    function getUrlParam(paramName) {
      const url = document.location.toString()
      const arrObj = url.split("?")
      if (arrObj.length > 1) {
        const arrPara = arrObj[1].split("&");
        for (var i = 0; i < arrPara.length; i++) {
          const arr = arrPara[i].split("=");
          if (arr != null && arr[0] == paramName) {
            return arr[1];
          }
        }
        return ""
      } else {
        return ""
      }
    }
    function IsPhone() {
        var info = navigator.userAgent;
        //通过正则表达式的test方法判断是否包含“Mobile”字符串
        var isPhone = /mobile/i.test(info);
        //如果包含“Mobile”（是手机设备）则返回true
        return isPhone;
    }
    console.log(IsPhone())
    if (IsPhone()) {
      const source = getUrlParam('source')
      if (source == 1) { // 个人认证
        wx.miniProgram.reLaunch({
          url: '/pages/user/personal/Certification?type=2'
        })
      } else if (source == 2) { // 企业认证
        wx.miniProgram.reLaunch({
          url: '/pages/user/company/Certification?type=3'
        })
      } else if (source == 3) { // 主页(签署完成)
        wx.miniProgram.reLaunch({
          url: '/pages/home/index'
        })
      } else if (source == 4) { // 添加印章
        wx.miniProgram.reLaunch({
          url: '/pages/user/companyMembers/index'
        })
        // wx.miniProgram.reLaunch({
        //   url: '/pages/user/company/companySeal?auth=1&companyId=' + getUrlParam('companyId')
        // })
      } else if (source == 6) { // 我的
        wx.miniProgram.reLaunch({
          url: '/pages/user/index'
        })
      } else if (source == 7) { // 合同详情
        if(getUrlParam('ext')){
          wx.miniProgram.redirectTo({
            url: '/pages/contract/detail/index?id=' + getUrlParam('ext')
          })
        }else{
          wx.miniProgram.navigateTo({
            url: '/pages/contract/sign/index'
          })
        }
      }
    } else {
      console.log('pc.postMessage')
      console.log(window.parent)
      document.getElementById('appBox').innerHTML = '签署完成!'
      window.parent.postMessage({
        msg: 'back',
      })
      console.log('pc.postMessage--->')
    }
  </script>
</html>
